version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: lomarket_db
    restart: always
    environment:
      MYSQL_DATABASE: lomarket
      MYSQL_ROOT_PASSWORD: nguyenminhtri
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: lomarket_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  mysql_data: